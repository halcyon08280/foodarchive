<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소분소분 — 1기 밀프렙 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --bg-card: #FFFFFF;
    --ink: #262521;
    --ink-soft: #6B6A60;
    --green: #3F6B4F;
    --green-deep: #2C4E38;
    --green-soft: #DCE6D3;
    --mustard: #E2A33B;
    --brick: #B7502E;
    --line: #E5E2D8;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Apple SD Gothic Neo", "Malgun Gothic", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --round: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; width:100%; overflow-x:hidden; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  header{
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(6px);
    background: rgba(255,255,255,0.9);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width: 40px; height: 40px; border-radius: 10px; background: var(--green);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:22px; height:22px; }
  .brand-text h1{
    margin:0; font-size: 24px; font-weight: 400; letter-spacing:-0.01em;
    font-family: var(--round); color: var(--green-deep);
  }
  .brand-text p{
    margin:0; font-size: 12px; color: var(--ink-soft); font-family: var(--mono);
    letter-spacing: 0.02em;
  }
  .search-box{
    display:flex; align-items:center; gap:6px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family: var(--sans); font-size: 13px; width: 160px; color: var(--ink);
  }

  .hero{ max-width: 1080px; margin: 0 auto; padding: 40px 24px 8px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--mono); font-size: 12px; color: var(--green-deep);
    background: var(--green-soft); padding: 5px 12px; border-radius: 999px;
    font-weight:700; letter-spacing: 0.02em;
  }
  .hero h2{
    font-size: clamp(26px, 4vw, 38px); font-weight: 900; letter-spacing: -0.02em;
    margin: 14px 0 8px; max-width: 620px;
  }
  .hero p{ color: var(--ink-soft); max-width: 560px; font-size: 14.5px; margin:0 0 4px; }

  main{ max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 26px; margin-top: 18px;
  }

  .empty-state{
    text-align:center; padding: 70px 20px; color: var(--ink-soft);
    border: 1.5px dashed var(--line); border-radius: var(--radius); margin-top: 18px;
  }
  .empty-state b{ display:block; color: var(--ink); font-size:16px; margin-bottom:6px; }

  .label-card{
    background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--line);
    overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    display:flex; flex-direction:column; position: relative;
  }
  .label-photo{ position: relative; aspect-ratio: 4/3; background: var(--green-soft); overflow:hidden; }
  .label-photo img{ width:100%; height:100%; object-fit: cover; display:block; }
  .label-photo .no-photo{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color: var(--green-deep); opacity:0.4;
  }
  .label-number{
    position:absolute; top:10px; left:10px;
    background: rgba(38,37,33,0.75); color:#fff;
    font-family: var(--mono); font-size: 11px; font-weight:700;
    padding: 4px 9px; border-radius: 999px; letter-spacing:0.02em;
  }

  .tear-line{ position: relative; height: 14px; background: var(--bg-card); display:flex; align-items:center; }
  .tear-line::before{ content:""; position:absolute; left:0; right:0; top:50%; border-top: 2px dashed var(--line); }
  .tear-line .punch{ position:absolute; width:10px; height:10px; border-radius:50%; background: var(--bg); top:50%; transform: translateY(-50%); }
  .tear-line .punch.left{ left: -5px; }
  .tear-line .punch.right{ right: -5px; }

  .label-body{ padding: 14px 18px 18px; flex:1; display:flex; flex-direction:column; }
  .label-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom: 10px; }
  .label-head h3{ margin:0; font-size: 16.5px; font-weight:800; letter-spacing:-0.01em; }
  .label-date{ font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space:nowrap; }

  .member-table{ display:flex; flex-direction:column; gap: 7px; margin-top: 4px; }
  .member-row{ display:flex; align-items:baseline; gap: 6px; font-size: 13.5px; }
  .member-row .m-name{ font-weight:700; flex-shrink:0; }
  .m-name::before{ content:"● "; color: var(--mustard); font-size:9px; }
  .leader{ flex:1; border-bottom: 1.5px dotted var(--line); transform: translateY(-3px); min-width: 10px; }
  .member-row .m-ing{
    font-family: var(--mono); font-size: 12.5px; color: var(--green-deep);
    background: var(--green-soft); padding: 1px 8px; border-radius: 6px;
    white-space: normal; max-width: 60%; text-align:right;
  }

  .notice{
    max-width: 1080px; margin: 0 auto; padding: 0 24px 40px;
    font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono);
  }

  @media (max-width: 640px){
    header{ padding: 12px 16px; }
    .search-box{ width:100%; }
    .search-box input{ width:100%; }
    .hero{ padding: 26px 16px 4px; }
    main{ padding: 20px 16px 60px; }
    .grid{ grid-template-columns: 1fr; gap: 20px; }
    .notice{ padding: 0 16px 30px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="9" width="16" height="11" rx="2" stroke="white" stroke-width="1.8"/>
        <path d="M4 9L6 4H18L20 9" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <line x1="9" y1="13" x2="9" y2="17" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="15" y1="13" x2="15" y2="17" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>소분소분</h1>
      <p>MEAL PREP CLUB · 1기 아카이브</p>
    </div>
  </div>
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6B6A60" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="#6B6A60" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="조 이름 검색">
  </div>
</header>

<section class="hero">
  <span class="eyebrow">ARCHIVE · SEASON 01</span>
  <h2>자취생들이 함께 만든 밀프렙, 그 기록.</h2>
  <p>매주 모여 밀프렙을 만들고 소분해서 각자의 냉장고로 가져간 1기 활동을 라벨 형태로 아카이빙합니다. 조별 사진과 함께 누가 어떤 재료를 가져왔는지 확인해보세요.</p>
</section>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <b>아직 등록된 기록이 없어요</b>
    아래 ENTRIES 데이터를 채워서 아카이브를 시작해보세요.
  </div>
</main>

<p class="notice">※ 이 아카이브는 정적 페이지예요. 새 기록을 추가하려면 이 파일을 열어서 아래 &lt;script&gt; 안 ENTRIES 데이터를 직접 수정해야 해요.</p>

   - date       : 활동 날짜, 반드시 "YYYY-MM-DD" 형식
   - photo      : 사진 경로 또는 URL (아래 "이미지 넣는 방법" 참고)
   - members    : 조원 배열. { name: "이름", ingredient: "가져온 재료" } 를
                  조원 수만큼 콤마(,)로 구분해서 나열

   ── 이미지 넣는 방법 (둘 중 하나) ──────────────────────────────────

           photo: "images/team1.jpg" 처럼 상대경로로 입력

   방법 B. 이미지 호스팅 사이트(예: imgur.com)에 사진을 올리고
           거기서 받은 이미지 직접 링크(.jpg로 끝나는 URL)를

      { name: "강주원", ingredient: "소고기, 쌀, 깨" },
      { name: "정민재", ingredient: "양파, 간장, 설탕, 쌀" },

      { name: "최유준", ingredient: "오징어, 잡곡밥" },

    photo: "https://imgur.com/e22TaC1", // ← 여기를 실제 사진 경로/링크로 교체하세요
    members: [

      { name: "오준영", ingredient: "설탕, 참기름, 후추, 깨" },

    members: [
      { name: "강주원", ingredient: "소고기, 쌀, 깨" },
      { name: "정민재", ingredient: "양파, 간장, 설탕, 쌀" },
      { name: "오하린", ingredient: "다진마늘, 후추" },
      { name: "김지은", ingredient: "참기름, 카레가루" },

      { name: "오준영", ingredient: "설탕, 참기름, 후추, 깨" },

      { name: "김소연", ingredient: "모짜렐라 치즈, 샐러드 채소" }

/* ---------- 아래는 화면에 그려주는 코드라 수정하지 않으셔도 돼요 ---------- */
const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function formatDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

function render(query=''){
  const q = query.trim().toLowerCase();
  const filtered = ENTRIES.filter(e => !q || (e.teamName||'').toLowerCase().includes(q));
  grid.innerHTML = '';
  emptyState.style.display = ENTRIES.length === 0 ? 'block' : 'none';

  filtered.forEach((e) => {
    const num = ENTRIES.indexOf(e) + 1;
    const card = document.createElement('div');
    card.className = 'label-card';

    const photoHtml = e.photo
      ? `<img src="${e.photo}" alt="${escapeHtml(e.teamName)} 사진" onerror="this.parentElement.innerHTML='<div class=&quot;no-photo&quot;>사진을 찾을 수 없어요<br>photo 경로 확인 필요</div>'">`
      : `<div class="no-photo">사진 없음</div>`;

    const rows = (e.members || []).map(m => `
      <div class="member-row">
        <span class="m-name">${escapeHtml(m.name)}</span>
        <span class="leader"></span>
        <span class="m-ing">${escapeHtml(m.ingredient)}</span>
      </div>`).join('');

    card.innerHTML = `
      <div class="label-photo">
        ${photoHtml}
        <span class="label-number">#${String(num).padStart(2,'0')}</span>
      </div>
      <div class="tear-line"><span class="punch left"></span><span class="punch right"></span></div>
      <div class="label-body">
        <div class="label-head">
          <h3>${escapeHtml(e.teamName || '이름 없는 조')}</h3>
          <span class="label-date">${formatDate(e.date)}</span>
        </div>
        <div class="member-table">${rows || '<span style="color:var(--ink-soft); font-size:13px;">등록된 조원이 없어요</span>'}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', ()=> render(searchInput.value));
render();
</script>
</body>
</html>
